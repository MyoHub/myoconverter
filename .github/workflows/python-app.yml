on:
  push:
    branches: ["main", "development", "dev*", "feature/*"]
    paths-ignore:
      - "docs/**"
      - "**/README.md"

  pull_request:
    branches: ["main", "development", "dev*", "feature/*"]
    paths-ignore:
      - "docs/**"
      - "**/README.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    defaults:
      run:
        shell: bash -el {0}
    name: Build (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04"]
#        os: ["ubuntu-22.04", "ubuntu-latest", "windows-latest"]
        python-version: ["3.11"]
        include:
          - os: ubuntu-22.04
            use-mamba: false
            miniforge-variant: Miniforge3
            conda-cmd: conda
          - os: ubuntu-latest
            use-mamba: true
            miniforge-variant: Miniforge3
            conda-cmd: mamba
#          - os: windows-latest
#            use-mamba: true
#            miniforge-variant: Mambaforge
#            conda-cmd: mamba
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Lint syntax and undefined names with Ruff
        run: |
          ruff check . --select=E9,F63,F7,F82 --statistics --exclude myoconverter/xml/forces/CoordinateLimitForce.py
      - name: Install mesa and patchelf
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              libgl1 \
              libgl1-mesa-dev \
              libglew-dev \
              libosmesa6-dev \
              libglfw3 \
              libosmesa6 \
              patchelf \
              software-properties-common
      - name: Setup ${{ matrix.miniforge-variant }}
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: myoConverter
          auto-activate-base: false
          auto-update-conda: true
          environment-file: conda_env.yml
          miniforge-variant: ${{ matrix.miniforge-variant }}
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          use-mamba: ${{ matrix.use-mamba }}
          channels: conda-forge
          channel-priority: flexible
      - name: Output ${{ matrix.miniforge-variant }} information
        run: |
          ${{ matrix.conda-cmd }} info
          ${{ matrix.conda-cmd }} list
          ${{ matrix.conda-cmd }} config --show-sources
          ${{ matrix.conda-cmd }} config --show
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
      - name: Test CLI, pipeline, and model conversion
        run: |
          conda activate myoConverter
          pytest myoconverter/tests/test_cli_and_pipeline.py -v
          MUJOCO_GL=osmesa python myoconverter/tests/model_unit_test.py
